<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AIGrowth Hub — Book an Appointment</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --surface2: #1c1c28;
    --border: #2a2a3d;
    --accent: #7c6aff;
    --accent2: #a78bfa;
    --text: #f0f0ff;
    --text-dim: #8888aa;
    --bubble-user: #7c6aff;
    --bubble-bot: #1c1c28;
    --green: #22d3a5;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 16px;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    background: radial-gradient(ellipse at 60% 0%, #1a1040 0%, #0a0a0f 60%);
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 24px;
  }
  .logo {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .logo-icon {
    width: 36px;
    height: 36px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }
  .logo-name {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 20px;
    letter-spacing: -0.3px;
    color: var(--text);
  }
  .tagline {
    font-size: 13px;
    color: var(--text-dim);
    letter-spacing: 0.2px;
  }

  /* Chat window */
  .chat-window {
    width: 100%;
    max-width: 480px;
    height: 560px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 24px 80px rgba(124, 106, 255, 0.12);
  }

  /* Chat header */
  .chat-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface2);
  }
  .avatar {
    width: 36px;
    height: 36px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }
  .chat-header-info h3 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
  }
  .status {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    color: var(--green);
  }
  .status-dot {
    width: 6px;
    height: 6px;
    background: var(--green);
    border-radius: 50%;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* Messages */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
  }
  .messages::-webkit-scrollbar { width: 4px; }
  .messages::-webkit-scrollbar-track { background: transparent; }
  .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .message {
    display: flex;
    flex-direction: column;
    max-width: 82%;
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .message.user { align-self: flex-end; align-items: flex-end; }
  .message.bot { align-self: flex-start; align-items: flex-start; }

  .bubble {
    padding: 11px 15px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.55;
  }
  .message.user .bubble {
    background: var(--bubble-user);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .message.bot .bubble {
    background: var(--bubble-bot);
    color: var(--text);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .time {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 4px;
    padding: 0 4px;
  }

  /* Typing indicator */
  .typing .bubble {
    padding: 14px 18px;
  }
  .dots {
    display: flex;
    gap: 4px;
    align-items: center;
  }
  .dots span {
    width: 6px;
    height: 6px;
    background: var(--text-dim);
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }
  .dots span:nth-child(2) { animation-delay: 0.2s; }
  .dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-5px); }
  }

  /* Input area */
  .input-area {
    padding: 14px 16px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
    align-items: flex-end;
    background: var(--surface);
  }
  textarea {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    padding: 10px 14px;
    resize: none;
    outline: none;
    max-height: 100px;
    min-height: 42px;
    line-height: 1.5;
    transition: border-color 0.2s;
  }
  textarea::placeholder { color: var(--text-dim); }
  textarea:focus { border-color: var(--accent); }

  .send-btn {
    width: 42px;
    height: 42px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none;
    border-radius: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: opacity 0.2s, transform 0.1s;
  }
  .send-btn:hover { opacity: 0.9; }
  .send-btn:active { transform: scale(0.95); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .send-btn svg { width: 18px; height: 18px; fill: white; }

  /* Footer */
  .footer {
    margin-top: 16px;
    font-size: 12px;
    color: var(--text-dim);
    text-align: center;
  }
  .footer span { color: var(--accent2); }

  @media (max-width: 520px) {
    .chat-window { height: calc(100vh - 160px); border-radius: 16px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <div class="logo-icon">📈</div>
    <span class="logo-name">AIGrowth Hub</span>
  </div>
  <p class="tagline">AI-powered appointment booking</p>
</div>

<div class="chat-window">
  <div class="chat-header">
    <div class="avatar">🤖</div>
    <div class="chat-header-info">
      <h3>Booking Assistant</h3>
      <div class="status"><div class="status-dot"></div> Online</div>
    </div>
  </div>

  <div class="messages" id="messages">
    <div class="message bot">
      <div class="bubble">👋 Hi! I'm your AI booking assistant. I'll help you schedule an appointment in just a few steps. Ready to get started?</div>
      <span class="time">Just now</span>
    </div>
  </div>

  <div class="input-area">
    <textarea id="input" placeholder="Type your message..." rows="1"></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
      </svg>
    </button>
  </div>
</div>

<div class="footer">Powered by <span>AIGrowth Hub</span> · AI Automation</div>

<script>
  const WEBHOOK_URL = 'https://primary-production-1740.up.railway.app/webhook/4e20bdd0-8457-4138-a8fc-51344be8f6ac';
  const sessionId = 'session_' + Math.random().toString(36).substr(2, 9);
  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const conversationHistory = [];

  function getTime() {
    return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function addMessage(text, role) {
    const div = document.createElement('div');
    div.className = `message ${role}`;
    div.innerHTML = `<div class="bubble">${text}</div><span class="time">${getTime()}</span>`;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function showTyping() {
    const div = document.createElement('div');
    div.className = 'message bot typing';
    div.id = 'typing';
    div.innerHTML = `<div class="bubble"><div class="dots"><span></span><span></span><span></span></div></div>`;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function removeTyping() {
    const t = document.getElementById('typing');
    if (t) t.remove();
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;

    // Add to history
    conversationHistory.push({ role: 'user', content: text });
    
    addMessage(text, 'user');
    inputEl.value = '';
    inputEl.style.height = 'auto';
    sendBtn.disabled = true;
    showTyping();

    try {
      const res = await fetch(WEBHOOK_URL, {
        method: 'POST',
        headers: { 
          'Content-Type': 'application/json',
          'Accept': 'application/json'
        },
        body: JSON.stringify({ 
          chatInput: text,
          message: text,
          text: text,
          input: text,
          sessionId: sessionId,
          action: 'sendMessage',
          history: conversationHistory
        })
      });
      
      removeTyping();
      
      if (!res.ok) {
        addMessage('Sorry, something went wrong. Please try again! 🙏', 'bot');
        return;
      }

      const data = await res.json();

      // Extract the AI text response
      let reply = '';
      if (Array.isArray(data) && data[0]) {
        const item = data[0];
        reply = item.output || item.text || item.message || '';
      } else if (data.output) reply = data.output;
      else if (data.text) reply = data.text;
      else if (data.message) reply = data.message;
      else if (typeof data === 'string') reply = data;
      else reply = '✅ Got it! Let me process that for you.';

      // Clean up the response
      reply = reply.replace(/\\n\\n/g, '<br><br>').replace(/\\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
      addMessage(reply, 'bot');
      // Save bot response to history
      conversationHistory.push({ role: 'assistant', content: reply });
    } catch (err) {
      removeTyping();
      console.error('Error:', err);
      addMessage('Sorry, there was a connection issue. Please try again! 🙏', 'bot');
    }

    sendBtn.disabled = false;
    inputEl.focus();
  }

  // Send on Enter (Shift+Enter for new line)
  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // Auto resize textarea
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = inputEl.scrollHeight + 'px';
  });
</script>
</body>
</html>
